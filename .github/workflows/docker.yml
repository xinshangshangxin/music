name: Deploy to ALI Docker

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ALI Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALI_CONTAINER_HOST }}
          username: ${{ secrets.ALI_CONTAINER_USER_NAME }}
          password: ${{ secrets.ALI_CONTAINER_PASSWORD }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: devtools/Dockerfile
          push: true
          target: api
          secrets: |
            "PUBLIC_ENV=${{ secrets.PUBLIC_ENV }}"
          tags: |
            ${{ secrets.ALI_CONTAINER_HOST }}/${{ secrets.ALI_CONTAINER_NAMESPACE }}/app-name-api:latest

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: devtools/Dockerfile
          push: true
          target: console
          secrets: |
            "PUBLIC_ENV=${{ secrets.PUBLIC_ENV }}"
          tags: |
            ${{ secrets.ALI_CONTAINER_HOST }}/${{ secrets.ALI_CONTAINER_NAMESPACE }}/app-name-console:latest
